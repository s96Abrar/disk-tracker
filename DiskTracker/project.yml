name: DiskTracker
options:
  bundleIdPrefix: com.disktracker
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  DiskTracker:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Binaries/disk-tracker-engine
        type: file
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.disktracker.app
        PRODUCT_NAME: DiskTracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/DiskTracker.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Xcode otherwise injects get-task-allow (debugger attach) into
        # Release too; only an App Store export would strip it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  DiskTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DiskTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.disktracker.app.tests
        PRODUCT_NAME: DiskTrackerTests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

