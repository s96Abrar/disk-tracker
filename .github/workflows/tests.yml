name: Tests

# Runs automatically on push to main (i.e. after a PR merges), and by hand
# otherwise. No `pull_request` trigger: macOS runners bill at 10x the Linux
# rate against a limited free-minute allowance, and firing on every PR push
# would exhaust it.
#
# To gate a merge on this passing, run it by hand against the PR branch
# (Actions tab -> Tests -> Run workflow, pick the branch) before merging;
# the run reports its status on that commit's SHA, which branch protection
# can require.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_release_build:
        description: "Also verify the Release bundle (slower)"
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust engine
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            traversal-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('traversal-engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        working-directory: traversal-engine
        run: cargo fmt --check

      - name: Clippy
        working-directory: traversal-engine
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: traversal-engine
        run: cargo test --release

  swift:
    name: Swift app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            traversal-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('traversal-engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The app spawns this binary; App Sandbox forbids launching anything
      # outside the bundle, so it has to be staged before xcodebuild runs.
      - name: Build engine
        run: ./build-disk-tracker --rust

      - name: Test
        working-directory: DiskTracker
        run: |
          set -o pipefail
          xcodebuild test \
            -project DiskTracker.xcodeproj \
            -scheme DiskTracker \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify || xcodebuild test \
            -project DiskTracker.xcodeproj \
            -scheme DiskTracker \
            -destination 'platform=macOS'

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: DiskTracker/TestResults.xcresult

  deferred:
    name: Deferred v0.5 code
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            traversal-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('traversal-engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build engine
        run: ./build-disk-tracker --rust

      # The services deferred out of v0.1 are gated behind DISKTRACKER_V05, so
      # nothing in a normal build touches them. Without this job they would rot
      # into code that no longer compiles while still looking alive in the tree.
      - name: Compile and test the gated code
        working-directory: DiskTracker
        run: |
          xcodebuild test \
            -project DiskTracker.xcodeproj \
            -scheme DiskTracker \
            -destination 'platform=macOS' \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) DISKTRACKER_V05'

  bundle:
    name: Release bundle
    if: inputs.run_release_build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # Same script the release workflow and local packaging use, so a green
      # run here means the release will build.
      - name: Verify bundle
        run: ./package-release --verify
