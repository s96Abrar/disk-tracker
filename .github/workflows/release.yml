name: Release

# Fires when a version tag is pushed:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Also runnable by hand against an existing tag, for re-cutting a failed
# release without moving the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write # needed to create the release and upload the DMG

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Resolve tag
        id: tag
        env:
          # Never interpolate event data straight into run:. Tags are
          # maintainer-controlled, but the shell should still see this as data.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag '$TAG' must look like v1.2.3"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            traversal-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('traversal-engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # A release that fails its own test suite should not exist.
      - name: Rust tests
        working-directory: traversal-engine
        run: cargo test --release

      - name: Swift tests
        run: |
          ./build-disk-tracker --rust
          cd DiskTracker
          xcodebuild test \
            -project DiskTracker.xcodeproj \
            -scheme DiskTracker \
            -destination 'platform=macOS'

      # The tag is the release's identity; a mismatch means users get a DMG
      # whose About box disagrees with the download page.
      - name: Check bundle version matches tag
        env:
          EXPECTED: ${{ steps.tag.outputs.version }}
        run: |
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                   DiskTracker/Resources/Info.plist)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag says $EXPECTED, Info.plist says $ACTUAL"
            exit 1
          fi
          echo "Version $ACTUAL"

      # Same script used locally — what CI publishes is reproducible by hand.
      - name: Build, verify and package
        run: ./package-release

      # RELEASE_NOTES.md is the single source. Generating notes here as well
      # meant two copies of the install instructions that could disagree, and
      # the one users read would be whichever this file said last.
      - name: Check release notes exist
        run: test -f RELEASE_NOTES.md || {
          echo "::error::RELEASE_NOTES.md is missing"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.dmg \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskTracker-${{ steps.tag.outputs.tag }}
          path: dist/*.dmg
          retention-days: 30
