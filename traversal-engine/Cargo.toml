[package]
name = "disk-tracker-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
libc = "0.2"
thiserror = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "scan_benchmark"
harness = false
path = "benches/scan_benchmark.rs"
